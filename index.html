                </span>

    <script>

            {"MODULO": "CLIENTES", "TELA": "1001", "TITULO": "TIPOS DE BLOQUEIOS PARA CLIENTES", "FILA": "MODA - LINX - WEBCHAMADOS ERP"},

            {"MODULO": "CLIENTES VAREJO", "TELA": "300145SPK", "TITULO": "TIPOS DE DOCUMENTO PARA CLIENTES VAREJO", "FILA": "MODA - LINX - WEBCHAMADOS LOJAS"},

            {"MODULO": "CONTA DIGITAL", "TELA": "009259SPK", "TITULO": "CONTA DIGITAL INTEGRADA", "FILA": "MODA - LINX - RC FFC"},
            {"MODULO": "CONTABILIDADE", "TELA": "009000SPK", "TITULO": "CONFIGURAÇÃO DE SALDO AGRUPADO", "FILA": "MODA - LINX - RC FFC"},
            {"MODULO": "CONTABILIDADE", "TELA": "009001SPK", "TITULO": "TIPO DE CONTA", "FILA": "MODA - LINX - RC FFC"},
            {"MODULO": "CONTABILIDADE", "TELA": "9004", "TITULO": "HISTÓRICO PADRÃO", "FILA": "MODA - LINX - RC FFC"},
            {"MODULO": "CONTABILIDADE", "TELA": "009006SPK", "TITULO": "TIPO DE MOVIMENTO", "FILA": "MODA - LINX - RC FFC"},
            {"MODULO": "CONTABILIDADE", "TELA": "009007SPK", "TITULO": "CONTA CONTÁBIL ANALÍTICA", "FILA": "MODA - LINX - RC FFC"},
            {"MODULO": "CONTABILIDADE", "TELA": "009008SPK", "TITULO": "TIPO DE LANÇAMENTO", "FILA": "MODA - LINX - RC FFC"},
            {"MODULO": "CONTABILIDADE", "TELA": "009010SPK", "TITULO": "CENTRO DE CUSTO", "FILA": "MODA - LINX - RC FFC"},
            {"MODULO": "CONTAS A PAGAR", "TELA": "009034SPK", "TITULO": "CONSULTA GERAL DE CONTA", "FILA": "MODA - LINX - RC FFC"},
            {"MODULO": "CONTAS A PAGAR", "TELA": "009061SPK", "TITULO": "CONSULTA DE COMISSÃO DE REPRESENTANTES", "FILA": "MODA - LINX - RC FFC"},
            {"MODULO": "CONTAS A PAGAR", "TELA": "009120SPK", "TITULO": "LISTA MOVIMENTOS DE FECHAMENTO DE COMISSÕES", "FILA": "MODA - LINX - RC FFC"},
            {"MODULO": "ESTOQUE", "TELA": "002001SPK", "TITULO": "CONSULTA DE SALDO DE ESTOQUE", "FILA": "MODA - LINX - SUPORTE"},
            {"MODULO": "VENDAS", "TELA": "007001SPK", "TITULO": "PEDIDO DE VENDA", "FILA": "MODA - LINX - VENDAS"}
        ];

        const colorCache = {};
        const colors = [
            'bg-blue-100 text-blue-700 border-blue-200', 
            'bg-indigo-100 text-indigo-700 border-indigo-200', 
            'bg-purple-100 text-purple-700 border-purple-200', 
            'bg-emerald-100 text-emerald-700 border-emerald-200', 
            'bg-amber-100 text-amber-700 border-amber-200', 
            'bg-rose-100 text-rose-700 border-rose-200',
            'bg-cyan-100 text-cyan-700 border-cyan-200'
        ];
        
        function getModuleBadge(moduleName) {
            if(!moduleName) return '<span class="px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 text-xs font-semibold">-</span>';
            const cleanName = String(moduleName).trim().toUpperCase();
            if(!colorCache[cleanName]) {
                colorCache[cleanName] = colors[Object.keys(colorCache).length % colors.length];
            }
            return `<span class="px-2.5 py-1 rounded-md ${colorCache[cleanName]} text-[11px] font-bold border shadow-sm whitespace-nowrap tracking-wide">${cleanName}</span>`;
        }

        function updateDashboardStats(data) {
            document.getElementById('statTelas').innerText = data.length.toLocaleString('pt-PT');
            const modulos = new Set(data.map(i => i['MODULO']).filter(v => v && String(v).trim() !== ''));
            document.getElementById('statModulos').innerText = modulos.size.toLocaleString('pt-PT');
            const filas = new Set(data.map(i => i['FILA']).filter(v => v && String(v).trim() !== ''));
            document.getElementById('statFilas').innerText = filas.size.toLocaleString('pt-PT');
        }

        function carregarDadosDemonstracao() {
            dadosBase = demoData;
            updateDashboardStats(dadosBase);
            renderTable(dadosBase);
            rodapeInfo.innerHTML = '<span class="text-amber-600 flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg> Modo de demonstração (ficheiro original não localizado).</span>';
        }

        try {
            Papa.parse("dados.csv", {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    dadosBase = results.data;
                    updateDashboardStats(dadosBase);
                    renderTable(dadosBase);
                },
                error: function() {
                    carregarDadosDemonstracao();
                }
            });
        } catch (erro) {
            console.warn("Ambiente de preview detetado ou erro de URL. A usar dados de demonstração.", erro);
            carregarDadosDemonstracao();
        }

        function renderTable(data) {
            tbody.innerHTML = '';
            if(data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="py-16 text-center"><div class="flex flex-col items-center gap-3"><svg class="w-10 h-10 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><span class="text-slate-500 font-medium">Nenhum resultado encontrado para a sua pesquisa.</span></div></td></tr>';
                if(rodapeInfo.innerText.indexOf('Modo de demonstração') === -1) {
                    rodapeInfo.innerText = "0 resultados.";
                }
                return;
            }

            const fragment = document.createDocumentFragment();
            const limit = Math.min(data.length, 300); 
            for (let i = 0; i < limit; i++) {
                const row = data[i];
                const tr = document.createElement('tr');
                tr.className = "hover:bg-blue-50/50 transition-colors group cursor-default";
                tr.innerHTML = `
                    <td class="py-3 px-6 whitespace-nowrap">${getModuleBadge(row['MODULO'])}</td>
                    <td class="py-3 px-6 whitespace-nowrap">
                        <span class="font-mono text-sm font-bold text-slate-700 bg-slate-100/80 px-2.5 py-1.5 rounded-md border border-slate-200 group-hover:bg-white group-hover:border-blue-200 group-hover:text-blue-700 transition-all shadow-sm">
                            ${row['TELA'] || '-'}
                        </span>
                    </td>
                    <td class="py-3 px-6 text-sm text-slate-800 font-medium">${row['TITULO'] || '-'}</td>
                    <td class="py-3 px-6 whitespace-nowrap text-sm text-slate-500">
                        <div class="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-full w-fit border border-slate-100 group-hover:bg-white transition-colors">
                            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                            ${row['FILA'] || '-'}
                        </div>
                    </td>
                `;
                fragment.appendChild(tr);
            }
            tbody.appendChild(fragment);

            if(rodapeInfo.innerText.indexOf('Modo de demonstração') === -1) {
                if (data.length > 300) {
                    rodapeInfo.innerText = `A mostrar 300 de ${data.length.toLocaleString('pt-PT')} resultados.`;
                } else {
                    rodapeInfo.innerText = `A mostrar os ${data.length.toLocaleString('pt-PT')} resultados.`;
                }
           }
        }

        let timeout = null;
        searchInput.addEventListener('input', function(e) {
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                const term = e.target.value.toLowerCase().trim();
                if (term === '') {
                    renderTable(dadosBase);
                    return;
                }
                const filtrados = dadosBase.filter(row => {
                    const modulo = String(row['MODULO'] || '').toLowerCase();
                    const tela = String(row['TELA'] || '').toLowerCase();
                    const titulo = String(row['TITULO'] || '').toLowerCase();
                    const fila = String(row['FILA'] || '').toLowerCase();
                    return modulo.includes(term) || tela.includes(term) || titulo.includes(term) || fila.includes(term);
                });
                renderTable(filtrados);
            }, 100); 
        });
    </script>
</body>
</html>
